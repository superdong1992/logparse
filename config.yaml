# 日志解析维护工具 - 配置
#
# 标记说明：
#   [按需修改] — 根据实际产品/日志格式需要调整的配置
#   [通常不改] — 一般情况保持默认即可，仅在特殊场景调整
#
# 生命周期切分 v2 配置文件选择：
#   - config.yaml：默认产品 module1 的 lifecycle_split v2 保持关闭，继续走旧 CycleDetector。
#   - config.lifecycle-v2.yaml：默认产品 module1 的 lifecycle_split v2 已开启。
#     运行时用 -c/--config 指定，例如：
#       python cli.py parse diagnostic_information.zip -c config.lifecycle-v2.yaml --product default

# ── 管道配置 ──────────────────────────────────────────
pipeline:
  recursive_extraction: true   # [通常不改] 外层包是否递归解压
  inner_extraction: true       # [通常不改] 是否解压诊断日志内层 .zip
  generate_metadata: true      # [通常不改] 是否生成 metadata.json
  output_base_dir: "./output"  # [按需修改] 输出根目录
  debug_expand_gz: false       # [通常不改] 调试用：解析过程中是否将 .gz 文件就地展开
  result_json_mode: "compact"  # [按需修改] result.json 模式：compact=轻量摘要，full=完整对象
  cleanup_extracted: false     # [按需修改] 解析完成后是否删除 extracted/ 工作区
  cleanup_inner_archives: false # [按需修改] 保留 extracted/ 时，是否删除已展开的内层 zip/tar 副本

# ── 产品插件注册 ──────────────────────────────────────
# 每个产品定义一对插件：
#   discovery  — 目录发现插件（找到 slot、匹配文件）
#   log_parser — 日志解析插件（提取时间戳、构建周期、判定角色）
# 新增产品：复制一份产品段，修改 plugin 路径和 config 即可
products:
  default:
    discovery:
      plugin: "backend.plugins.default.scanner.ScannerPlugin"  # [通常不改] 插件类路径
      config:
        diagnostic_dir: "diag"              # [按需修改] 诊断日志目录名（外层包内的顶层目录）
        private_dir: "varlog"               # [按需修改] 私有日志目录名
        slot_dir_pattern: "slot_*"          # [按需修改] 槽位目录匹配（glob），如 "board_*"
        diag_file_patterns:                 # [按需修改] 诊断日志文件名匹配（glob 列表）
          - "diag.zip"
          - "diaglog_*.log.zip"
          - "diaglog_*.zip"
        filename_timestamp_regex: ".*_(\\d{14})\\..*"  # [按需修改] 文件名转储时间戳提取正则，\d{14}=YYYYMMDDHHmmss
        private_dir_patterns:               # [按需修改] 私有日志目录匹配（glob 列表），支持 slot 和 slot_cpu 子卡
          - "slot_*"
          - "slot_*_cpu_*"
        archive_name: "varlog.zip"          # [按需修改] 内层压缩包名
        journal_file_patterns:              # [按需修改] journal 文件名匹配（glob 列表）
          - "journal.log"
          - "journal.log.*.gz"
        journal_sequence_regex: "journal\\.log(?:\\.(\\d+))?(?:\\.gz)?"  # [通常不改] journal 序号提取
        compressed_extensions: [".gz", ".zip", ".tar.gz", ".tgz", ".tar"]  # [通常不改] 识别为压缩文件的扩展名

    log_parser:
      plugin: "backend.plugins.default.parser.ParserPlugin"  # [通常不改] 插件类路径
      config:
        # [按需修改] 日志行时间戳提取正则
        # 必须含两个捕获组：组1=时间戳，组2=可选时区偏移
        # 默认匹配格式：2026-01-03T10:37:07.980482+08:00 或 2026-01-03 10:37:07
        timestamp_regex: "(\\d{4}-\\d{1,2}-\\d{1,2}[T ]\\d{2}:\\d{2}:\\d{2}(?:\\.\\d+)?)([+-]\\d{2}:\\d{2})?"

        # [按需修改] ActivePeriod 切分阈值（秒）
        # 两个连续时间戳间隔超过此值时，切分为新的 ActivePeriod
        active_period_gap_threshold: 300

        mechanism_modules:
          module1:   # [按需修改] 模块标识（可任意命名，如 module1、ctrl、aaa）
            plugin: "backend.plugins.mechanisms.module1.Module1Plugin"
            enabled: true
            config:
              module_name: "EXAMPLE"  # [按需修改] 日志中实际出现的模块名（全大写），用于 Stage1 大小写敏感预过滤

              # [按需修改] 诊断日志匹配正则
              # 必须含命名组：Slot, CPU_Id, ProcessName, Context
              # 可用 test-pattern 命令验证是否匹配
              diag_pattern: 'Service=(?P<Service>[^;]+).*?Slot=(?P<Slot>[^;,)]+).*?CPU-Id=(?P<CPU_Id>[^;,)]+).*?ProcessName=(?P<ProcessName>[^;,)]+).*?Context=(?P<Context>.+?)\)$'

              # [按需修改] 主控判定关键字（正则），命中 Context 时该 Slot 判为 ACTIVE
              # 留空则仅靠 ActivePeriod 兜底判定
              active_master_keyword: ""

              # [按需修改] 旧 CycleDetector 专用：板卡重启标识进程名（小写）
              # lifecycle_split v2 不使用该字段；v2 配置请写到 lifecycle_split.reliable_processes。
              # 此进程 PID 变化时触发重启周期切分，一定是非独立重启进程
              # 留空则不按 PID 切分
              board_restart_indicator: ""

              # [按需修改] 旧 CycleDetector 专用：切分计算白名单进程（小写列表）
              # lifecycle_split v2 不使用白名单概念；v2 用 reliable_processes 和 multi_instance_processes 表达进程分类。
              # 白名单内的进程需满足：不重名、不支持独立重启
              # 切分点计算仅参考白名单进程的 PID 和序号信息，避免同名/独立重启进程干扰
              # 留空则退化为仅用 indicator 的时间戳作为切分点
              board_restart_whitelist: []
              # 示例:
              # board_restart_whitelist:
              #   - "svc_a"
              #   - "svc_b"

              # [按需修改] 旧 CycleDetector/旧 journal resolver 专用：进程名映射（诊断日志名 → journal 日志名）
              # lifecycle_split v2 的 canonical alias 映射不要写在这里，要写到 lifecycle_split.process_name_mapping。
              # 用于 journal 中 indicator 进程名与诊断日志不一致时的映射
              # 示例：{"DHCP": "dhcpd", "AAA": "aaa_svc"}
              process_name_mapping: {}

              # [按需修改] lifecycle_split（默认产品 module1）
              # 当前 config.yaml 故意保持 enabled: false，用作旧 CycleDetector/兼容配置。
              # 若要在默认产品启用 v2，优先使用 config.lifecycle-v2.yaml：
              #   python cli.py parse <package_path> -c config.lifecycle-v2.yaml --product default
              # 只有 enabled: true 会启用新 lifecycle_split；未配置或 enabled: false 都走旧 CycleDetector。
              # algorithm 缺省为 interval_v2；写 interval_v3 会启用“30 秒候选切分 + 白名单一致性聚合”。
              # 注意：这里的 process_name_mapping 是 lifecycle_split 专用别名表，格式为
              #   canonical_name: [alias_in_diag, alias_in_journal]
              # 它不同于上面的旧 process_name_mapping（诊断日志名 -> journal 日志名）。
              # reliable_processes：生命周期绑定的可靠进程，统一写 canonical_name 列表。
              #   日志实际无 cpu_id / cpu_id=0 时生成 board 边界证据；
              #   日志实际带 CPU 编号时生成对应 CPU 边界证据。
              # multi_instance_processes：允许同名多实例的进程，不参与 same PID 一致性校验，也不作为边界证据。
              lifecycle_split:
                enabled: false
                algorithm: interval_v2
                process_name_mapping: {}
                reliable_processes: []
                multi_instance_processes: []

              journal:
                # [按需修改] journal pattern supports two capture layouts:
                # 4 groups: process_name, pid, sequence, context
                # 3 groups: process_name, pid, context
                # Standard no-sequence logs are auto-supported by deriving a 3-group
                # fallback from the configured 4-group pattern. Keep the No[n]
                # pattern below unless the surrounding journal format also changes.
                line_pattern: '^\S+\s+\S+\s+\S+?:\s+\[slotId\s*=\s*\d+,\s*cpuId\s*=\s*\d+,\s*processName\s*=\s*(\S+?)-(\d+)\]:\s+No\[(\d+)\](.+)$'

                # [按需修改] journal 格式2正则（无元数据块，PID 可选，fallback）
                # 支持 4 组（进程名、PID、序号、上下文）或 3 组（进程名、PID、上下文）
                line_pattern2: '^\S+\s+\S+\s+(\S+?)(?:-(\d+))?:\s+No\[(\d+)\](.+)$'
                # [可选] line_pattern2 / auto_no_sequence 命中后的大小写敏感整行字符串约束。
                # 为空列表时不启用；配置后原始 journal 行必须包含其中任一字符串。
                line_pattern2_required_substrings: []

                # [按需修改] journal Stage1 关键字预过滤（小写）
                # journal 行必须包含此关键字才会进入正则匹配，加速过滤
                identifying_keyword: "EXAMPLE"

              # [通常不改] 序号提取正则，用于丢号检测和重启序号回绕判定
              sequence_pattern: 'No\[(\d+)\]'

          module2:   # 诊断日志-only 机制模块，复用 module1 生命周期切分结果；必须声明在 module1 之后
            plugin: "backend.plugins.mechanisms.module2.Module2Plugin"
            enabled: true
            config:
              module_name: "MODULE2"
              identifying_keyword: "xxx"
              depends_on_module: "module1"
              diag_pattern: 'Slot=(?P<Slot>[\d/]+),CPU-Id=(?P<CPU_Id>\d+),ProcessName=(?P<ProcessName>[^,]+),Context="(?P<Context>.*?)"'

  # ── compact 产品示例 ──────────────────────────────────
  # 演示不同目录布局（boards/ + logs/）如何复用默认 ParserPlugin
  compact:
      discovery:
        plugin: "backend.plugins.compact.scanner.CompactScannerPlugin"
        config:
          diagnostic_dir: "boards"
          private_dir: "logs"
          slot_dir_pattern: "slot_*"
          diag_file_patterns:
            - "debug_*.log"
          filename_timestamp_regex: ".*_(\\d{8})\\..*"
          private_dir_patterns:
            - "slot_*"
          syslog_file_patterns:
            - "syslog.log"
          compressed_extensions: [".gz", ".zip", ".tar.gz", ".tgz", ".tar"]
      log_parser:
        plugin: "backend.plugins.default.parser.ParserPlugin"
        config:
          timestamp_regex: "(\\d{4}-\\d{1,2}-\\d{1,2}[T ]\\d{2}:\\d{2}:\\d{2}(?:\\.\\d+)?)([+-]\\d{2}:\\d{2})?"
          active_period_gap_threshold: 7200
          mechanism_modules:
            ctrl:
              plugin: "backend.plugins.mechanisms.module1.Module1Plugin"
              enabled: true
              config:
                module_name: "COMPACT"
                diag_pattern: 'COMPACT\s+(?P<Service>\S+).*?proc=(?P<ProcessName>\S+).*?slot\s+(?P<Slot>\d+).*?cpu\s+(?P<CPU_Id>\d+).*?\|(?P<Context>.+)'
                active_master_keyword: ""
                # [按需修改] 旧 CycleDetector 专用：板卡重启标识进程名。
                # compact 产品如果开启 lifecycle_split v2，应把生命周期进程分类写到下面的 lifecycle_split 段。
                board_restart_indicator: ""
                # [按需修改] 旧 CycleDetector/旧 journal resolver 专用：诊断日志名 → journal 日志名映射。
                # lifecycle_split v2 的 canonical alias 映射不要写在这里。
                process_name_mapping: {}
                # [按需修改] lifecycle_split（compact 产品 ctrl 模块）
                # 这里的 compact 是 --product compact 的产品示例，不是 pipeline.result_json_mode: compact。
                # 它有自己独立的 Module1Plugin 实例和独立的 lifecycle_split 开关；解析默认产品时不会读取这一段。
                # 只有执行 `python cli.py parse ... --product compact` 时，这里的 lifecycle_split 才生效。
                # 默认仍关闭，避免 compact 示例产品在未填写可靠进程前改变切分行为。
                # 如需启用，改成 enabled: true，并按 compact 日志里的真实进程名填写：
                #   algorithm: interval_v2 或 interval_v3
                #   process_name_mapping: canonical_name -> [diag/journal aliases]
                #   reliable_processes: 可作为生命周期边界证据的 canonical_name 列表
                #   multi_instance_processes: 同名多实例、不要参与一致性校验的 canonical_name
                lifecycle_split:
                  enabled: false
                  algorithm: interval_v2
                  process_name_mapping: {}
                  reliable_processes: []
                  multi_instance_processes: []
                journal:
                  line_pattern: ''
                  line_pattern2: '^\S+\s+\S+\s+(\S+)(?:-(\d+))?:\s+COMPACT\s+No\[(\d+)\](.+)$'
                  line_pattern2_required_substrings: []
                  identifying_keyword: "COMPACT"
                sequence_pattern: 'No\[(\d+)\]'
