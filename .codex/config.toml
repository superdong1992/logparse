# Project-local ECC baseline for Codex.
# Keep credentials and machine-specific MCP definitions in ~/.codex/config.toml.

persistent_instructions = "Follow AGENTS.md first, then CLAUDE.md for repository-specific logparse rules."

[features]
multi_agent = true
memories = true
remote_connections = true

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "Reviewer focused on correctness, security, regressions, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist for primary-source API and release-note verification."
config_file = "agents/docs-researcher.toml"
