validation:
  environment: Windows，.venv 中的 Python 3.12.14；使用仓内 .pytest_tmp 独立临时目录和合成样例，不读取现有 output/outputs。
  tests:
    - tests/test_generated_skill_contract.py：35 passed，覆盖原有24项及新增11项产品参数回归。
    - tests/test_parse_integration.py：6 passed，CLI 解析显式选择 default/compact，并验证对应产品、模块、进程、PID 和目标证据。
    - .venv\Scripts\python.exe scripts/verify_delivery.py：760 passed, 2 skipped；Ruff、compileall 和 check-config 通过。
    - 覆盖率 line 90.70%、branch 78.09%、architecture_core 90.71%，达到既有80/70/90门槛。
    - 两个修改过的技能均通过 skill-creator/scripts/quick_validate.py，使用 -X utf8 避免 Windows 默认 GBK 解码问题。
  lan_scenario: 本地使用仓内合成技能正文和两套产品 mock 验证参数传递、解析及确定性目标查询；没有真实 LAN 案例，未执行真实历史 corpus 或2GB包验收。
  contract_tests:
    - 产品输入、交接清单、预处理命令分别缺失时拒绝；将字段放在其他章节、只在其他说明中提及产品或部分命令漏参也不能通过。
    - 规范技能及参考文件的完整 parse 示例都显式传产品；生成模板及对应 Claude 入口校验通过。
    - 两产品 CLI 显式选择返回对应 manifest.product 和机制键，目标为 exact / LP_TARGET_OK；原有产物、查询和 DFX 闭环继续通过。
  security_tests:
    - 完整交付检查覆盖解压安全、样本读取、工作区链接边界、产物完整性与 DFX 上下文约束；760项通过、2项跳过，未削弱任何门禁或安全检查。
  smoke_tests:
    - tests/test_parse_integration.py 的两产品 CLI 解析及目标查询均通过，目标日志存在；同文件原有 ParseService 与 DFX 闭环通过。
  delivery_checks:
    - rule_preflight.py --changed、change_gate.py --changed 及使用本记录的 --enforce 检查通过。
    - git diff --check 通过；本轮涉及的8份 Markdown 中123个本地链接全部有效。
    - 独立复核已确认原始输入与已有结果的处理规则、产品交接及命令示例一致，未修改日期解析。
  limitations:
    - 首次完整验证在沙盒中为746 passed、14 failed、2 skipped；失败集中在 Windows 文件元数据及目录联接权限。自动审批允许后，在沙盒外重跑同一 verify_delivery.py，结果为760 passed、2 skipped。
    - 聚焦解析测试首次受系统 Temp 权限影响，改用仓内独立临时目录后通过；未修改运行时代码以规避权限检查。
    - 合成回归不代表真实产品命名、日志规格或 LAN 验收；文件名日期解析未修改。
