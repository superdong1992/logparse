evidence:
  real_case_id: >-
    HANDOFF-ARCH-2026-07-11: owner-approved architecture-only relocation and
    contract evolution; no real-log business-rule conclusion was changed
  fixture: >-
    tests/mock_data/diagnostic_information_20260103.zip,
    tests/mock_data_compact/compact_package_20260103.zip, and focused synthetic
    unit fixtures
  corpus_regression: >-
    All 481 external synthetic/mock tests passed. The real historical corpus is
    intentionally deferred to mandatory LAN import acceptance because logs
    cannot leave the LAN.

compatibility:
  schema_impact: >-
    Config is schema v2 with green product includes; metadata and result are
    schema v2; parse manifest, target_logs envelope, and native plugin contracts
    are version 1. Native mechanisms receive bounded inputs without ParseResult;
    LegacyMechanismContext and old query/DFX/plugin import façades preserve LAN
    migration compatibility. Public issue-locator entrypoints parse,
    mech-target-logs, dfx-output, root cli.py, and the logparse-diagnose skill
    remain available. Explicit unknown query artifact schemas fail with
    LP_SCHEMA_UNSUPPORTED.

architecture:
  adr:
    - docs/adr/0001-lan-only-authority.md
    - docs/adr/0002-architecture-boundaries.md
    - docs/adr/0003-versioned-contracts-and-artifacts.md
    - docs/adr/0004-deterministic-dfx-boundary.md
  approval: >-
    Repository owner explicitly approved this implementation plan and its
    LAN-only handoff constraints on 2026-07-11.
  rollback: >-
    Before LAN import, restore the previous clean main worktree. After an
    authorized handoff commit, revert that commit or restore the retained
    pre-handoff main snapshot inside the LAN; never attempt LAN-to-external
    reverse synchronization.
