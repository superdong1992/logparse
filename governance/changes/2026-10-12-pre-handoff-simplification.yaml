  - tests/test_parser_plugin.py / test_mechanism_execution.py：单次共享读取、空批次、去重、时区、串并行、失败传播与依赖隔离。
  - tests/test_product_engine.py：所选产品解压配置独立，交换声明顺序，运行选项覆盖与结构化失败。
  - tests/test_query.py / test_dfx.py / test_artifacts.py：缺失、不可读、坏JSON、非对象及schema错误。
  security_tests:
  - tests/test_decompressor.py：解压路径越界、链接、压缩安全与嵌套归档。
  - tests/infrastructure/test_artifact_repository.py：原子写入失败、manifest路径越界、符号链接、不可读及完整性哈希。
  - tests/test_dfx.py / tests/test_parse_integration.py：上下文限额、紧凑索引不含原始正文、默认DFX不提取诊断上下文。
  - tests/test_parse_workspace.py：归属校验、保留用户文件、失败重跑、清理故障、原始目录、双向输入输出重叠、symlink/junction边界。
