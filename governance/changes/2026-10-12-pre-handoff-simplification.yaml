architecture:
  adr: docs/adr/0006-pre-handoff-simplification.md
  approval: 仓库所有者于 2026-10-12 确认 LAN 无后续修改，明确允许破坏兼容、 修改 logparse-develop，并批准实施完整精简计划。
  rollback: 在批准的本地流程中恢复本轮开始前基线；只回退本轮变更，保留其他并发工作。 不推送、不外传 LAN 数据。
