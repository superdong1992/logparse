<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日志解析维护工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>日志解析维护工具</h1>
    <span class="subtitle">Log Package Parser</span>
  </header>

  <main>
    <!-- 上传区 -->
    <section class="card upload-section">
      <div class="drop-zone" id="dropZone">
        <div class="drop-icon">&#128230;</div>
        <p>拖拽压缩包到此处，或点击选择文件</p>
        <p class="hint">支持 .zip / .tar.gz / .tgz / .gz</p>
        <input type="file" id="fileInput" accept=".zip,.gz,.tar.gz,.tgz,.tar" hidden>
        <button id="selectBtn" class="btn btn-primary">选择文件</button>
      </div>
      <div class="upload-status" id="uploadStatus" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p id="statusMsg"></p>
      </div>
    </section>

    <!-- 结果区 -->
    <section class="card result-section" id="resultSection" style="display:none">
      <div class="result-header">
        <h2>解析结果</h2>
        <span class="task-id" id="taskId"></span>
      </div>

      <!-- 设备概览 -->
      <div class="overview" id="overview"></div>

      <!-- 板卡列表 -->
      <div class="board-list" id="boardList"></div>

      <!-- 倒换时间线 -->
      <div class="timeline-section" id="timelineSection" style="display:none">
        <h3>主备倒换时间线</h3>
        <div class="timeline" id="timeline"></div>
      </div>

      <!-- 错误信息 -->
      <div class="error-section" id="errorSection" style="display:none"></div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
